<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b0f3b">
<title>Tappabuchi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#1b0f3b; --ink:#1b0f3b; --yellow:#ffd23f; --pink:#ff4fa3; --cyan:#3ee6d0;
  --muted:#b9a8ff; --green:#16a34a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:
    radial-gradient(circle at 15% 0%,#3a1d86 0,transparent 50%),
    radial-gradient(circle at 100% 100%,#5a1660 0,transparent 45%),
    var(--bg);
  background-attachment:fixed;
  color:#fff;font-family:Rubik,system-ui,sans-serif;
  -webkit-tap-highlight-color:transparent;
}
.screen{min-height:100vh;min-height:100dvh;padding:24px 16px;display:flex;flex-direction:column;gap:18px;max-width:1200px;margin:0 auto}
.center{align-items:center;justify-content:center;text-align:center}
.phone{max-width:520px}
.grow{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;text-align:center}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
.between{justify-content:space-between}

.logo{font-family:Bungee,sans-serif;font-size:clamp(44px,10vw,96px);margin:0;line-height:.95;color:var(--yellow);
  text-shadow:0 6px 0 #b8860b,0 12px 30px rgba(0,0,0,.4);transform:rotate(-3deg)}
.logo span{color:var(--pink);text-shadow:0 6px 0 #a3125e,0 12px 30px rgba(0,0,0,.4)}
.logo.sm{font-size:clamp(34px,5.5vw,60px)}
.tag{font-size:clamp(17px,2vw,22px);color:#e9e3ff;margin:4px 0 8px}
.huge{font-family:Bungee,sans-serif;font-size:clamp(34px,6vw,76px);margin:0;color:var(--yellow);line-height:1.05}
.lead{font-size:clamp(17px,1.8vw,24px);color:#e9e3ff;max-width:820px;margin:0 auto;line-height:1.4}
.muted{color:var(--muted)}
.small{font-size:14px}
h2,h3{margin:0}

.btn{font:800 18px Rubik,sans-serif;border:0;border-radius:16px;padding:14px 22px;background:var(--yellow);color:var(--ink);
  box-shadow:0 6px 0 #c79a00;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c79a00}
.btn.big{font-size:21px;padding:18px 28px;width:100%;max-width:440px}
.btn.alt{background:var(--cyan);box-shadow:0 6px 0 #1a9f8e}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none;border:2px solid rgba(255,255,255,.2)}
.btn.small{font-size:15px;padding:10px 16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.link{background:none;border:0;color:var(--muted);font:600 16px Rubik,sans-serif;cursor:pointer;padding:8px}
.stack{display:flex;flex-direction:column;gap:16px;width:100%;align-items:center}

.card{background:#fff;color:var(--ink);border-radius:22px;padding:20px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.how{max-width:520px;text-align:left;margin-top:10px}
.how ol{padding-left:20px;margin:10px 0 0;line-height:1.5}
.form{width:100%;display:flex;flex-direction:column;gap:16px;text-align:left}

label{display:flex;flex-direction:column;gap:6px;font-weight:600;text-align:left}
input,select,textarea{font:600 18px Rubik,sans-serif;padding:14px;border-radius:14px;border:3px solid #e3dcff;color:var(--ink);background:#fff;width:100%}
textarea{font-size:15px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pink);outline:none}
#jcode{text-transform:uppercase;letter-spacing:.3em;font-family:Bungee,sans-serif;text-align:center;font-size:28px}
.check{flex-direction:row;align-items:center;gap:10px}
.check input{width:22px;height:22px}
.err{background:#ffe1e1;color:#a40000;padding:10px 14px;border-radius:12px;font-weight:600}

.prompt{font-weight:800;font-size:22px;line-height:1.4}
.prompt.big{font-size:clamp(26px,3.4vw,50px);text-align:center;max-width:1050px;margin:0 auto}
.blank{display:inline-block;min-width:3em;height:1em;border-bottom:.12em solid currentColor;margin:0 .15em;vertical-align:-.1em}
.fill{background:var(--yellow);color:var(--ink);padding:0 .25em;border-radius:.25em;-webkit-box-decoration-break:clone;box-decoration-break:clone}

.hdr{display:flex;justify-content:space-between;width:100%;gap:10px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.1);padding:6px 14px;border-radius:99px;font-weight:700;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.chip{padding:10px 16px;border-radius:999px;font-weight:800;color:var(--ink);animation:pop .3s both}
.chip.off{opacity:.35}

.timer{display:flex;align-items:center;gap:12px;width:100%;max-width:700px;margin:0 auto}
.tbar{flex:1;height:14px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
#tbar{height:100%;width:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));transition:width .2s linear}
.tnum{font-family:Bungee,sans-serif;font-size:28px;min-width:2.2ch;text-align:right}

.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:24px;align-items:center;width:100%}
.vs.one{grid-template-columns:minmax(0,720px);justify-content:center}
.vsbadge{font-family:Bungee,sans-serif;font-size:48px;color:var(--pink);text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;width:100%}
@media (max-width:820px){.vs{grid-template-columns:1fr}.vsbadge{font-size:34px}}
.acard{background:#fff;color:var(--ink);border-radius:24px;padding:24px;border:6px solid var(--c);
  font-size:clamp(19px,2.3vw,32px);font-weight:700;line-height:1.35;animation:pop .45s both;text-align:left}
.acard.win{box-shadow:0 0 0 6px var(--yellow),0 20px 50px rgba(0,0,0,.5)}
.ameta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;font-size:18px}
.aname{padding:4px 12px;border-radius:999px;color:var(--ink);font-weight:800}
.votes{font-weight:800}
.pts{font-family:Bungee,sans-serif;color:var(--green);font-size:26px;margin-left:auto}
.voters{width:100%;font-size:15px;color:#6b5b9a;font-weight:600}
.banner{font-family:Bungee,sans-serif;font-size:clamp(28px,4.2vw,58px);color:var(--yellow);text-align:center;animation:stamp .5s both;line-height:1.1}

.lobby{display:grid;grid-template-columns:1.3fr 1fr;gap:28px;align-items:start;width:100%}
.lobbyL{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.lobbyR{display:flex;flex-direction:column;gap:14px}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.joinbox{display:flex;gap:20px;align-items:center;background:rgba(255,255,255,.08);border-radius:22px;padding:16px;flex-wrap:wrap}
#qr{background:#fff;padding:8px;border-radius:12px;line-height:0}
.code{font-family:Bungee,sans-serif;font-size:clamp(48px,7vw,84px);color:var(--yellow);letter-spacing:.08em;line-height:1}
.url{font-size:13px;color:var(--muted);word-break:break-all;max-width:360px}

.ptop{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);padding:10px 14px;border-radius:14px}
.pscore{margin-left:auto;font-family:Bungee,sans-serif;color:var(--yellow)}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.emoji{font-size:72px;animation:bob 2s ease-in-out infinite}
.inputs{display:flex;flex-direction:column;gap:12px}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:4px solid transparent;border-radius:18px;
  padding:18px;font:700 19px/1.4 Rubik,sans-serif;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.opt.sel{border-color:var(--pink)}
.opt:disabled{opacity:.6}

.board{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.brow{display:grid;grid-template-columns:40px 170px 1fr 90px;gap:12px;align-items:center;font-size:20px;font-weight:800;animation:slide .4s both;text-align:left}
.bpts{text-align:right;font-family:Bungee,sans-serif;color:var(--yellow)}
.bbar{height:22px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden}
.bbar div{height:100%;border-radius:99px;transition:width .8s}
@media (max-width:600px){.brow{grid-template-columns:30px 1fr 80px}.bbar{display:none}}

.mebox{background:#fff;color:var(--ink);border-radius:22px;padding:18px;width:100%;max-width:640px;margin:0 auto;text-align:left;
  display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.mebox:empty{display:none}
.mehead{display:flex;align-items:center;gap:10px;font-weight:800}
.mehead .pscore{color:var(--ink)}
.mebox .prompt{font-size:20px}
.mewait{display:flex;align-items:center;gap:12px;font-size:18px}
.mewait .emoji{font-size:36px;animation:none}
.acard.pick{cursor:pointer;transition:transform .12s}
.acard.pick:hover{transform:translateY(-4px)}
.acard.sel{box-shadow:0 0 0 6px var(--pink),0 20px 50px rgba(0,0,0,.5)}
.acard.big{font-size:clamp(24px,3vw,42px)}
.acard.lose{animation-name:popdim;font-size:clamp(16px,1.7vw,24px)}
.acard.reveal{animation:flipin .6s cubic-bezier(.2,1.4,.4,1) both}
.vsbadge{animation:pop .4s both}
.gains{width:100%;max-width:820px;display:flex;flex-direction:column;gap:10px}
.gain{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 16px;font-size:20px;font-weight:700;animation:slide .4s both;flex-wrap:wrap}
.gpts{margin-left:auto;font-family:Bungee,sans-serif;color:#7ee36b;font-size:28px}
.tag{background:var(--pink);color:#fff;border-radius:99px;padding:3px 10px;font-size:14px;font-weight:800}
.delta{color:#7ee36b;font-size:15px}
.opt.tally{cursor:default}
.rename{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;max-width:420px;margin:6px auto}
.rename.host{align-items:stretch;max-width:520px;background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;margin:0}
.rcur{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;font-size:17px}
.rform{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%}
.rform[hidden],.rcur[hidden]{display:none}
.rrow{display:flex;gap:8px;width:100%}
.rrow input{flex:1;min-width:0;padding:10px 12px;font-size:17px}
.rlabel{font-weight:700;font-size:14px;color:var(--muted)}
.rmsg{min-height:1.2em;font-weight:700;font-size:14px}
.rmsg.ok{color:#9ef08c}
.rmsg.bad{color:#ffb4b4}
[data-players] .chip{animation:none}
.screen{--colw:1200px}
.screen.phone{--colw:520px}
/* riquadro fisso, allineato al bordo destro della colonna dei contenuti (non dello schermo) */
.nextbar{position:fixed;z-index:50;bottom:calc(16px + env(safe-area-inset-bottom));
  right:max(16px, calc(50% - var(--colw) / 2 + 16px));width:min(260px, calc(100% - 32px));
  display:flex;flex-direction:column;gap:8px;background:#2d2353;border-radius:14px;padding:12px 14px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);animation:slideup .35s both}
.nlabel{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800;font-size:15px;line-height:1.2}
.nlabel b{font-family:Bungee,sans-serif;font-size:18px;color:var(--yellow);white-space:nowrap}
.nextbar .tbar{flex:none;height:8px}
/* barra dell'host: tempo + pulsante affiancati, resta attaccata in fondo mentre scorri */
.hbar.hnext{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;border-top:0;
  background:#2d2353;border-radius:14px;padding:12px 14px;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);animation:slideup .35s both}
.hbar.hnext.wide{width:100%;max-width:700px;margin:0 auto}
.hcd{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;text-align:left}
.hcd .tbar{flex:none;height:8px}
.hnext .btn{flex:none;white-space:nowrap}
/* due righe: sopra "prossima schermata + secondi", sotto barra + pulsante */
.hbar.hnext{display:grid;grid-template-columns:1fr auto;align-items:center;column-gap:14px;row-gap:8px}
.hnext .hcd{display:contents}
.hnext .nlabel{grid-column:1 / -1}
.hnext .tbar{grid-column:1;grid-row:2}
.hnext .btn{grid-column:2;grid-row:2}
/* spazio in fondo alla pagina perché il riquadro non copra niente quando scorri fino in fondo */
body:has(.nextbar) .vfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
@keyframes slideup{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
#app .screen{min-height:calc(100vh - 44px);min-height:calc(100dvh - 44px)}
.vfoot{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 6px;padding:8px 16px 14px}
.vbtn{background:none;border:0;color:var(--muted);font:600 13px Rubik,sans-serif;cursor:pointer;padding:6px 10px;border-radius:99px}
.vbtn:hover,.vbtn:focus-visible{background:rgba(255,255,255,.08);color:#fff;outline:none}
.notes{position:fixed;inset:0;z-index:100;background:rgba(10,5,30,.7);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadein .2s both}
.notesbox{background:#fff;color:var(--ink);border-radius:22px;width:100%;max-width:520px;max-height:85vh;max-height:85dvh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s both}
.noteshead{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 10px;border-bottom:2px solid #eee8ff}
.noteshead h2{font-family:Bungee,sans-serif;font-size:24px;color:var(--pink)}
.notesx{background:#eee8ff;border:0;width:36px;height:36px;border-radius:50%;font:800 16px Rubik,sans-serif;color:var(--ink);cursor:pointer}
.notesbody{overflow-y:auto;padding:6px 20px 20px;-webkit-overflow-scrolling:touch}
.note{padding:14px 0;border-bottom:1px solid #eee8ff}
.note:last-child{border-bottom:0}
.notev{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vtag{font-family:Bungee,sans-serif;font-size:16px;background:#eee8ff;padding:3px 10px;border-radius:99px}
.vtag.new{background:var(--yellow)}
.vnew{background:var(--pink);color:#fff;font-weight:800;font-size:11px;letter-spacing:.06em;padding:3px 8px;border-radius:99px}
.vdate{margin-left:auto;color:#6b5b9a;font-size:13px;font-weight:600}
.vday{font-weight:800;font-size:18px}
.notev .vtag{margin-left:auto;font-size:14px}
.note ul{margin:10px 0 0;padding-left:20px;line-height:1.45}
.note li{margin:4px 0}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.testbadge{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:99;background:#ff8a3d;color:#1b0f3b;font:800 12px Rubik,sans-serif;letter-spacing:.08em;padding:4px 12px;border-radius:0 0 10px 10px;pointer-events:none}
.wstatus{display:flex;flex-direction:column;gap:12px;background:rgba(255,255,255,.07);border-radius:18px;padding:14px}
.wgroup{display:flex;flex-direction:column;gap:8px}
.wstatus{gap:8px}
.wsum{font-weight:800;font-size:15px;text-align:center;margin-bottom:4px}
.wrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-weight:700;font-size:16px}
.wrow.writing{background:rgba(255,210,63,.14)}
.wrow.done{background:rgba(126,227,107,.16)}
.wrow.me{outline:2px solid rgba(255,255,255,.6)}
.wname{flex:1;min-width:0;overflow-wrap:anywhere}
.wstate{font-size:14px;white-space:nowrap}
.wrow.done .wstate{color:#9ef08c}
.wrow.writing .wstate{color:var(--yellow)}
.dots i{font-style:normal;animation:blink 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
.wlabel{font-weight:800;font-size:15px}
.wstatus .chips{justify-content:flex-start}
.wstatus .chip{padding:7px 12px;font-size:14px;animation:none}
.chip.mechip{outline:3px solid #fff}
body{transition:background-color .4s}
body[data-mode="vote"]{background:radial-gradient(circle at 50% 0%,#0f6b6f 0,transparent 60%),#0b3140;background-attachment:fixed}
body[data-mode="fight"]{background:radial-gradient(circle at 50% 0%,#8a1456 0,transparent 60%),#3b0a2a;background-attachment:fixed}
.modehead{border-radius:20px;padding:16px 14px;text-align:center;animation:stamp .45s both;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.modehead .mt{font-family:Bungee,sans-serif;font-size:26px;line-height:1.1}
.modehead .ms{font-weight:700;margin-top:6px;font-size:16px}
.modehead.vote{background:var(--cyan);color:var(--ink)}
.modehead.fight{background:var(--pink);color:#fff}
.votebtn{display:flex;align-items:flex-start;gap:12px;border-color:var(--cyan)}
.votebtn:active{transform:translateY(3px)}
.votebtn.sel{border-color:var(--yellow);background:#fffbe6}
.optletter{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-family:Bungee,sans-serif;font-size:16px}
.opt.rival{opacity:.85}
.tag.grey{background:#8b80b3}
.votedcount{text-align:center;font-weight:700;color:#ffd0e8}
.pcard.reveal{animation:flipin .6s cubic-bezier(.2,1.4,.4,1) both}
.hp{display:flex;flex-direction:column;gap:18px;flex:1}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid rgba(255,255,255,.15);padding-top:12px}
.hbar:empty{display:none}
.pbanner{font-family:Bungee,sans-serif;font-size:28px;color:var(--yellow);text-align:center;line-height:1.15;animation:stamp .5s both}
.mymsg{background:var(--pink);color:#fff;font-weight:800;border-radius:14px;padding:10px 14px;text-align:center}
.pcard{background:#fff;color:var(--ink);border-radius:18px;padding:16px;border:5px solid var(--c);font:700 18px/1.4 Rubik,sans-serif;animation:pop .4s both}
.pcard.win{box-shadow:0 0 0 4px var(--yellow)}
.pcard.lose{opacity:.75}
.pcard .ameta{font-size:15px;margin-top:10px}
.gain.small{font-size:16px;padding:10px 12px}
.gain.small .gpts{font-size:20px}
.gain.me,.prow.me{outline:3px solid var(--yellow)}
.pboard{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:10px 14px;font-weight:800;font-size:17px;animation:slide .4s both}
.ppos{min-width:28px}
.pname{flex:1;min-width:0;overflow-wrap:anywhere}
.opt.mine{border-color:var(--pink)}
.tbarv{height:12px;background:#ece7ff;border-radius:99px;overflow:hidden;margin-top:12px}
.tbarv div{height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow));border-radius:99px;transition:width .4s}
.tcount{font-family:Bungee,sans-serif;font-size:18px;margin-top:6px}
.home{max-width:480px;gap:22px}
.manage{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.manage h3{margin:6px 0 2px}
.mrow{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:14px;padding:8px 10px;flex-wrap:wrap}
.mname{flex:1;min-width:90px;font-weight:700;overflow-wrap:anywhere}
.mrow .btn.small{padding:8px 12px;font-size:14px;min-height:40px}
.btn.ghost.danger{color:#ffb4b4;border-color:rgba(255,120,120,.45)}
.backhome{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px 8px 10px;border-radius:999px;border:2px solid rgba(255,255,255,.22);
  background:transparent;color:#e9e3ff;font:700 15px Rubik,sans-serif;cursor:pointer}
.backhome:hover,.backhome:focus-visible{background:rgba(255,255,255,.1);color:#fff;outline:none}
.signwrap{width:100%;display:flex;flex-direction:column;align-items:center}
.sign{position:relative;width:100%;box-sizing:border-box;background:#2a1a5e;border-radius:28px;padding:30px 22px 32px;
  box-shadow:0 0 0 9px #2a1a5e,0 0 40px rgba(255,210,63,.3);display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:signglow 2.4s ease-in-out infinite alternate}
.bulbs{position:absolute;inset:0;pointer-events:none}
.bulb{position:absolute;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#6e5a1c;
  animation:bulb 1s linear var(--d,0s) infinite}
/* acceso per metà giro, spento per l'altra metà; lo sfasamento di ogni lampadina crea l'inseguimento */
@keyframes bulb{0%,49.9%{background:var(--yellow);box-shadow:0 0 6px 1px rgba(255,210,63,.9)}50%,100%{background:#6e5a1c;box-shadow:none}}
@keyframes signglow{from{box-shadow:0 0 0 9px #2a1a5e,0 0 26px rgba(255,210,63,.22)}to{box-shadow:0 0 0 9px #2a1a5e,0 0 58px rgba(255,210,63,.5)}}
@keyframes flicker{0%,18%,21%,24%,100%{opacity:1}19%,22%{opacity:.35}23%{opacity:.8}}
.signlogo{margin:0;font-family:Bungee,sans-serif;font-weight:400;font-size:clamp(50px,15vw,64px);line-height:.98;text-align:center;color:var(--yellow);text-shadow:0 5px 0 #b8860b}
.signlogo span{color:var(--pink);text-shadow:0 5px 0 #a3125e;display:inline-block;animation:flicker 5s linear infinite}
.stage{width:78%;height:18px;background:#2a1a5e;border-radius:0 0 50% 50%}
.signwrap.compact{max-width:340px;margin:6px auto 0}
.signwrap.compact .sign{padding:22px 18px 24px;border-radius:24px}
.signwrap.compact .signlogo{font-size:clamp(36px,11vw,46px)}
.signwrap.compact .stage{height:12px}
.lobbyL .signwrap.compact{margin:6px 0 0}
.hometag{margin:0;font-size:19px;line-height:1.4;color:#e9e3ff}
.homebtn{display:flex;align-items:center;justify-content:center;gap:10px}
.homechips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.homechips span{border:2px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:#e9e3ff}
.howto{width:100%;display:flex;flex-direction:column;gap:16px;text-align:left;margin-top:6px}
.howto h2{font-family:Bungee,sans-serif;font-weight:400;font-size:22px;color:#fff}
.notesgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.hnote{color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:14px;box-shadow:4px 4px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:6px}
.hnote b{font-family:Bungee,sans-serif;font-weight:400;font-size:28px;line-height:1}
.hnote p{margin:0;font-size:15px;line-height:1.35;font-weight:600}
.hnote.n1{background:var(--yellow);transform:rotate(-1.5deg)}
.hnote.n2{background:var(--cyan);transform:rotate(1.5deg)}
.hnote.n3{background:#ff8fc4;transform:rotate(1deg)}
.hnote.n4{background:#c9bcff;transform:rotate(-1deg)}
.spinner{width:56px;height:56px;border:6px solid rgba(255,255,255,.2);border-top-color:var(--yellow);border-radius:50%;animation:spin 1s linear infinite}
.shake{animation:shake .35s}

@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes stamp{0%{opacity:0;transform:scale(2) rotate(-6deg)}70%{transform:scale(.95) rotate(-2deg)}100%{opacity:1;transform:scale(1) rotate(-2deg)}}
@keyframes popdim{from{opacity:0;transform:scale(.85)}to{opacity:.7;transform:none}}
@keyframes flipin{from{opacity:0;transform:translateY(40px) rotateX(70deg) scale(.9)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .sign .bulb{animation:bulb 1s linear var(--d,0s) infinite!important}
  .sign{animation:signglow 2.4s ease-in-out infinite alternate!important}
  .signlogo span{animation:flicker 5s linear infinite!important}}

@media (max-width:900px){
  .lobby{max-width:520px;margin:0 auto}

  .lobbyR{text-align:left}
}

// lampadine dell'insegna: 48 punti equidistanti sul bordo (angoli arrotondati compresi).
// Ognuna si accende e si spegne a turno: animazione semplice che funziona su tutti i browser.
const BULBS = 48;
function placeBulbs(sign){
  const box = sign.querySelector('.bulbs'); if (!box) return;
  const w = sign.offsetWidth, h = sign.offsetHeight; if (!w || !h) return;
  const key = w + 'x' + h; if (box.dataset.k === key) return; box.dataset.k = key;
  const r = Math.min(parseFloat(getComputedStyle(sign).borderTopLeftRadius) || 0, w / 2, h / 2);
  const sw = w - 2 * r, sh = h - 2 * r, arc = Math.PI * r / 2;
  const segs = [ // [lunghezza, punto alla distanza t]
    [sw, t => [r + t, 0]],
    [arc, t => { const a = -Math.PI / 2 + t / r; return [w - r + r * Math.cos(a), r + r * Math.sin(a)]; }],
    [sh, t => [w, r + t]],
    [arc, t => { const a = t / r; return [w - r + r * Math.cos(a), h - r + r * Math.sin(a)]; }],
    [sw, t => [w - r - t, h]],
    [arc, t => { const a = Math.PI / 2 + t / r; return [r + r * Math.cos(a), h - r + r * Math.sin(a)]; }],
    [sh, t => [0, h - r - t]],
    [arc, t => { const a = Math.PI + t / r; return [r + r * Math.cos(a), r + r * Math.sin(a)]; }]
  ];
  const total = segs.reduce((a, x) => a + x[0], 0), step = total / BULBS;
  let html = '';
  for (let i = 0; i < BULBS; i++){
    let d = i * step, k = 0;
    while (k < segs.length - 1 && d > segs[k][0]){ d -= segs[k][0]; k++; }
    const [x, y] = segs[k][1](Math.min(d, segs[k][0]));
    html += `<i class="bulb" style="left:${x.toFixed(1)}px;top:${y.toFixed(1)}px;--d:${(-(i % 4) * 0.25).toFixed(2)}s"></i>`;
  }
  box.innerHTML = html;
}
function placeAllBulbs(){ document.querySelectorAll('.sign').forEach(placeBulbs); }

/* L'host che gioca usa una "connessione" locale: passa per gli stessi messaggi dei telefoni. */
const LOCAL = {open:true, peer:'local', send: m => localRecv(m)};
function localRecv(m){
  if (!H.me) return;
  if (m.t === 'joined'){ const p = H.players.find(x => x.conn === LOCAL); if (p){ p.host = true; H.me.id = p.id; } }
  else if (m.t === 'view'){ H.me.view = m.v; if (document.getElementById('hp')) drawHP(); else drawMe(); }
  else if (m.t === 'renamed'){ store('tb_name', m.name); const e = document.getElementById('hrmsg'); if (e){ e.className = 'rmsg ok'; e.textContent = 'Nome cambiato!'; } }
  else if (m.t === 'renameErr'){ const e = document.getElementById('hrmsg'); if (e){ e.className = 'rmsg bad'; e.textContent = m.msg; } }
}
function drawMe(){
  const el = document.getElementById('me');
  if (!el || !H.me || !H.me.view) return;
  const v = H.me.view;
  const key = viewKey(v);
  if (el.dataset.key === key) return;
  el.dataset.key = key;
  el.innerHTML = `<div class="mehead"><span class="dot" style="background:${v.color}"></span>Tu: ${esc(v.name)}<span class="pscore">${v.score} pt</span></div>`
               + playerBody(v, true);
  wirePlayer(el, v, d => hostMsg(LOCAL, d));
}

function hostStart(myName, fixedCode, tries){
  clearSess();
  if (typeof Peer === 'undefined') return showError('Impossibile caricare la libreria di rete. Controlla la connessione.');
  MODE = 'host';
  app.innerHTML = spinner(fixedCode ? `Diventi l'host della stanza ${fixedCode}…` : 'Creo la stanza…');
  const code = fixedCode || genCode();
  const peer = new Peer(PREFIX + code);
  let opened = false;
  peer.on('open', () => {
    opened = true; H.peer = peer; H.code = code; H.phase = 'lobby';
    H.me = myName ? {id:null, view:null} : null;
    if (myName) hostMsg(LOCAL, {t:'join', name:myName});
    renderHost(true); wake();
    window.onbeforeunload = () => 'Uscendo chiudi la partita per tutti.';
  });
  peer.on('connection', onConn);
  peer.on('disconnected', () => { try { peer.reconnect(); } catch(e){} });
  peer.on('error', e => {
    if (e.type === 'unavailable-id' && !opened){
      peer.destroy();
      // passaggio di host: il codice si libera appena il vecchio host esce, riprovo per qualche secondo
      if (fixedCode && (tries || 0) < 15) return setTimeout(() => hostStart(myName, fixedCode, (tries || 0) + 1), 1000);
      hostStart(myName);
    }
    else if (!opened) showError('Errore di rete (' + e.type + '). Riprova.');
    else console.warn(e);
  });
}

async function wake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch(e){} }
document.addEventListener('visibilitychange', () => { if (MODE === 'host' && document.visibilityState === 'visible') wake(); });

function onConn(conn){
  conn.on('data', d => { try { hostMsg(conn, d); } catch(e){ console.error(e); } });
  const lost = () => { const p = H.players.find(x => x.conn === conn) || H.audience.find(x => x.conn === conn); if (p) markLost(p, false); };
  conn.on('close', lost); conn.on('error', lost);
}
// un giocatore è sparito (connessione chiusa o nessun segnale da troppo tempo)
function markLost(p, closeIt){
  if (!p.connected || p.conn === LOCAL) return;
  p.connected = false;
  if (closeIt) try { p.conn.close(); } catch(e){}
  if (p.aud){ if (H.phase === 'lobby') H.audience.splice(H.audience.indexOf(p), 1); }
  else if (H.phase === 'lobby') H.players.splice(H.players.indexOf(p), 1);
  broadcast(); renderHost(); checkProgress();
}
// controllo di presenza: chi non manda segnali da 15 secondi viene segnato come disconnesso
const HOST_TIMEOUT = 15000;
setInterval(() => {
  if (MODE !== 'host') return;
  const now = Date.now();
  [...H.players, ...H.audience].forEach(p => { if (p.conn !== LOCAL && p.connected && p.hb && p.seen && now - p.seen > HOST_TIMEOUT) markLost(p, true); });
}, 3000);

const byId = id => H.players.find(p => p.id === id);
const cur = () => H.matchups[H.cur];
const answered = m => m.players.filter(id => m.answers[id]);
const canVote = (p, m) => m.final ? true : !m.players.includes(p.id);
const elig = m => H.players.filter(p => canVote(p, m));
const sorted = () => H.players.slice().sort((a,b) => b.score - a.score);
const rank = p => 1 + H.players.filter(x => x.score > p.score).length;

function hostMsg(conn, d){
  if (!d || typeof d !== 'object') return;
  if (d.t === 'join'){
    const name = String(d.name || '').trim().replace(/\s+/g,' ').slice(0, 16);
    if (!name) return send(conn, {t:'err', msg:'Inserisci un nome.'});
    const tok = String(d.tok || '').slice(0, 64);
    if (tok && H.banned.has(tok)) return send(conn, {t:'err', msg:"L'host ti ha fatto uscire da questa stanza."});
    // prima cerco il dispositivo (chiave segreta), poi il nome
    let p = (tok && H.players.find(x => x.tok === tok)) || H.players.find(x => x.name.toLowerCase() === name.toLowerCase());
    if (p){
      const sameDevice = tok && p.tok === tok;
      if (!sameDevice && (p.conn === LOCAL || (p.connected && p.conn !== conn && p.conn && p.conn.open)))
        return send(conn, {t:'err', msg:'Nome già in uso. Scegline un altro.'});
      // stesso dispositivo che rientra: chiudo la vecchia connessione (magari ancora "appesa" dopo un crash)
      if (p.conn && p.conn !== conn && p.conn !== LOCAL) try { p.conn.close(); } catch(e){}
      p.conn = conn; p.connected = true; if (tok) p.tok = tok;
    } else {
      // già nel pubblico (stesso telefono o stesso nome)?
      let a = (tok && H.audience.find(x => x.tok === tok)) || H.audience.find(x => x.name.toLowerCase() === name.toLowerCase());
      if (a){
        const sameDevice = tok && a.tok === tok;
        if (!sameDevice && a.connected && a.conn !== conn && a.conn && a.conn.open) return send(conn, {t:'err', msg:'Nome già in uso. Scegline un altro.'});
        if (a.conn && a.conn !== conn) try { a.conn.close(); } catch(e){}
        a.conn = conn; a.connected = true; if (tok) a.tok = tok;
      }
      // partita già iniziata o stanza piena: si entra come pubblico
      else if (H.phase !== 'lobby' || H.players.length >= 10){
        if (H.audience.length >= MAX_AUD) return send(conn, {t:'err', msg:'Stanza piena, anche il pubblico. Aspetta la prossima partita!'});
        a = {id:'a' + (++H.seq), name, conn, connected:true, tok, aud:true, score:0, color:AUD_COLOR};
        H.audience.push(a);
      }
      if (a){ a.seen = Date.now(); send(conn, {t:'joined', name:a.name}); broadcast(); renderHost(); return; }
      const used = H.players.map(x => x.color);
      p = {id:'p' + (++H.seq), name, score:0, conn, connected:true, tok, color: COLORS.find(c => !used.includes(c)) || COLORS[0]};
      H.players.push(p);
    }
    p.seen = Date.now();
    send(conn, {t:'joined', name:p.name});
    broadcast(); renderHost(); return;
  }
  const p = H.players.find(x => x.conn === conn);
  if (!p){ const a = H.audience.find(x => x.conn === conn); if (a) audMsg(a, conn, d); return; }
  p.seen = Date.now();
  if (d.t === 'ping'){ p.hb = true; return send(conn, {t:'pong'}); }

  if (d.t === 'rename'){
    const err = msg => send(conn, {t:'renameErr', msg});
    if (H.phase !== 'lobby') return err('Puoi cambiare nome solo nella lobby, tra una partita e l\'altra.');
    const name = String(d.name || '').trim().replace(/\s+/g, ' ').slice(0, 16);
    if (!name) return err('Scrivi un nome.');
    if (name === p.name) return send(conn, {t:'renamed', name});
    if (H.players.some(x => x !== p && x.name.toLowerCase() === name.toLowerCase())) return err('Questo nome è già usato da un altro giocatore.');
    p.name = name;
    send(conn, {t:'renamed', name});
    broadcast(); renderHost();
    return;
  }
  if (d.t === 'answer' && H.phase === 'answer'){
    const m = H.matchups[d.mid];
    if (!m || !m.players.includes(p.id) || m.answers[p.id]) return;
    const n = Math.max(1, blanks(m.prompt));
    const parts = [];
    for (let i = 0; i < n; i++) parts.push(String((d.parts || [])[i] || '').trim().slice(0, 45));
    if (parts.every(x => !x)) return;
    m.answers[p.id] = parts.map(x => x || '…');
    broadcast(); renderHost(); checkProgress();
  }
  else if (d.t === 'vote' && H.phase === 'vote'){
    const m = cur();
    if (!m || !canVote(p, m) || m.votes[p.id]) return;
    if (d.choice === p.id || !m.answers[d.choice]) return;
    m.votes[p.id] = d.choice;
    if (!m.final) m.players.forEach(id => { const a = byId(id); if (a) sendView(a); });
    sendView(p); renderHost(); checkProgress();
  }
}

// messaggi dal pubblico: solo il voto (tutto il pubblico insieme vale un voto)
function audMsg(a, conn, d){
  a.seen = Date.now();
  if (d.t === 'ping'){ a.hb = true; return send(conn, {t:'pong'}); }
  if (d.t === 'rename') return send(conn, {t:'renameErr', msg:'Nel pubblico non puoi cambiare nome.'});
  if (d.t === 'vote' && H.phase === 'vote'){
    const m = cur(); if (!m) return;
    m.aud = m.aud || {};
    if (m.aud[a.id] || !m.answers[d.choice]) return;
    m.aud[a.id] = d.choice;
    if (!m.final) m.players.forEach(id => { const x = byId(id); if (x) sendView(x); });
    sendAudView(a); renderHost(); checkProgress();
  }
}
function checkProgress(){
  if (H.phase === 'answer'){
    const c = H.players.filter(p => p.connected);
    if (c.length && c.every(p => H.matchups.every(m => !m.players.includes(p.id) || m.answers[p.id]))) endAnswer();
  } else if (H.phase === 'vote'){
    const m = cur();
    const c = elig(m).filter(p => p.connected), ac = H.audience.filter(a => a.connected);
    if ((c.length || ac.length) && c.every(p => m.votes[p.id]) && ac.every(a => (m.aud || {})[a.id])) endVote();
  }
}

/* --- timer --- */
function setTimer(sec, fn, show = true){
  const t = ++H.tok; clearTimeout(H.to);
  H.timerEnd = show ? Date.now() + sec*1000 : 0;
  H.timerTotal = show ? sec*1000 : 0;
  H.to = setTimeout(() => { if (t === H.tok){ H.timerEnd = 0; fn(); } }, sec*1000);
}
function clearTimer(){ H.tok++; clearTimeout(H.to); H.timerEnd = 0; H.timerTotal = 0; }

/* --- prompt --- */
function parseCustom(raw){
  return raw.split('\n').map(l => l.trim().replace(/_{2,}/g, '___')).filter(l => l.length > 3)
    .map(l => (blanks(l) ? l : l + ' ___').slice(0, 160));
}
function allPrompts(){ return (H.onlyCustom && H.custom.length) ? H.custom : PROMPTS.concat(H.custom); }
function pick(n, preferTwo){
  let pool = allPrompts().filter(t => !H.used.has(t));
  if (pool.length < n){ H.used.clear(); pool = allPrompts(); }  // finite tutte: si ricomincia
  pool = shuffle(pool);
  if (preferTwo){ const two = pool.filter(t => blanks(t) >= 2); if (two.length) pool = two; }
  const out = pool.slice(0, n);
  out.forEach(t => H.used.add(t));
  store('tb_used', JSON.stringify([...H.used]));
  while (out.length < n) out.push(shuffle(allPrompts())[0]);
  return out;
}

/* --- flusso di gioco --- */
function readSettings(){
  const a = $('#setAns'), v = $('#setVote'), c = $('#custom'), o = $('#onlyCustom');
  if (a) H.settings.answerTime = +a.value;
  if (v) H.settings.voteTime = +v.value;
  if (c){ H.customRaw = c.value; H.custom = parseCustom(c.value); }
  if (o) H.onlyCustom = o.checked && H.custom.length > 0;
}
function startGame(){
  if (H.players.length < 3) return;
  readSettings();
  H.players.forEach(p => p.score = 0);
  H.round = 1; startRound();
}
function startRound(){
  clearTimer();
  const ids = shuffle(H.players.map(p => p.id));
  if (H.round < 3){
    H.matchups = pick(ids.length).map((t, i) => ({prompt:t, players:[ids[i], ids[(i+1) % ids.length]], answers:{}, votes:{}}));
  } else {
    H.matchups = [{prompt:pick(1, true)[0], players:ids, answers:{}, votes:{}, final:true}];
  }
  H.cur = -1; H.phase = 'intro';
  renderHost(); broadcast();
  setTimer(5, startAnswer, false);
}
function startAnswer(){
  H.phase = 'answer';
  const t = H.round < 3 ? H.settings.answerTime : Math.max(45, Math.round(H.settings.answerTime * 0.6));
  setTimer(t, endAnswer);
  renderHost(); broadcast();
}
function endAnswer(){ clearTimer(); H.phase = 'switch'; H.cur = -1; nextMatch(); }
function nextMatch(){
  clearTimer();
  H.cur++;
  if (H.cur >= H.matchups.length) return H.round >= 3 ? endGame() : nextRound();
  const m = cur();
  const ans = answered(m);
  if (ans.length === 0) return nextMatch();
  m.order = m.final ? shuffle(ans) : ans;
  if (ans.length === 1){ m.forfeit = ans[0]; return showWinner(m); }
  if (!m.final && norm(m.answers[ans[0]].join(' ')) === norm(m.answers[ans[1]].join(' '))){ m.jinx = true; return showWinner(m); }
  // 1) le risposte compaiono una alla volta
  H.phase = 'show';
  renderHost(); broadcast();
  setTimer(1 + m.order.length * revealStep(m) + 1.2, startVote, false);
}
const revealStep = m => m.final ? 1.4 : 1.8;
// 2) votazione
function startVote(){
  const m = cur();
  H.phase = 'vote';
  setTimer(m.final ? H.settings.voteTime + 10 : H.settings.voteTime, endVote);
  renderHost(); broadcast();
}
function endVote(){ showWinner(cur()); }
// 3) vincitore della sfida
function showWinner(m){
  clearTimer(); score(m);
  H.phase = 'winner';
  setTimer(AUTO.winner, showPoints);
  renderHost(); broadcast();
}
// secondi prima di passare da soli alla schermata successiva
const AUTO = {winner:8, points:14};
// cosa arriva dopo (usato dalla barra countdown e dai pulsanti dell'host)
function nextLabel(){
  if (H.phase === 'winner') return 'Punti e classifica';
  if (H.phase === 'points'){
    if (!isLastMatch()) return 'Prossima sfida';
    return H.round < 3 ? (H.round === 1 ? 'Round 2' : 'Round finale') : 'Classifica finale';
  }
  return '';
}
// 4) punti assegnati + classifica generale
function showPoints(){
  clearTimer();
  H.phase = 'points';
  setTimer(AUTO.points, nextMatch);
  renderHost(); broadcast();
}
function winnersOf(m){
  if (!m.R || m.jinx || m.novotes) return [];
  if (m.forfeit) return [m.forfeit];
  const ids = answered(m), max = Math.max(...ids.map(id => m.R[id].votes));
  return max > 0 ? ids.filter(id => m.R[id].votes === max) : [];
}
function winnerText(m){
  const w = winnersOf(m), names = w.map(id => byId(id).name).join(' e ');
  if (m.jinx) return {title:'Stessa risposta! 🙈', sub:'Avete scritto la stessa cosa: nessuno vince.'};
  if (m.novotes) return {title:'Nessun voto', sub:'Nessuno ha votato questa sfida.'};
  if (m.forfeit) return {title:'Vince ' + names + '!', sub: m.final ? "È l'unico ad aver risposto." : "L'avversario non ha risposto: vittoria a tavolino."};
  if (w.length > 1) return {title:'Pareggio!', sub: names + ' con ' + m.R[w[0]].votes + ' voti a testa.'};
  const v = m.R[w[0]].votes;
  return {title:'🏆 Vince ' + names + '!', sub: m.cappotto ? 'CAPPOTTO! Ha preso tutti i voti.' : `Con ${v} vot${v === 1 ? 'o' : 'i'}.`};
}
// classifica generale da mandare ai telefoni
function boardData(me, gains = {}){
  return sorted().map(p => ({name:p.name, color:p.color, score:p.score, rank:rank(p), delta:gains[p.id] || 0, me:p.id === me.id, host:!!p.host}));
}
function introText(){
  return H.round === 1 ? 'Ogni sfida vale 1000 punti, divisi in base ai voti. Prendi tutti i voti e fai CAPPOTTO: bonus!'
       : H.round === 2 ? 'Punti doppi! Ogni sfida vale 2000.'
       : 'Una sola frase per tutti. Ogni voto vale 500 punti.';
}
function isLastMatch(){ return H.matchups.slice(H.cur + 1).every(x => answered(x).length === 0); }
function score(m){
  if (m.scored) return; m.scored = true;
  const R = {};
  m.players.forEach(id => R[id] = {votes:0, pts:0, voters:[]});
  Object.entries(m.votes).forEach(([v, c]) => { if (R[c]){ R[c].votes++; const vp = byId(v); R[c].voters.push(vp ? vp.name : '?'); } });
  let total = Object.keys(m.votes).length;
  const av = Object.values(m.aud || {}).filter(c => R[c]);
  if (av.length){
    const cnt = {}; av.forEach(c => cnt[c] = (cnt[c] || 0) + 1);
    const max = Math.max(...Object.values(cnt)), top = Object.keys(cnt).filter(k => cnt[k] === max);
    if (top.length === 1){ R[top[0]].votes++; R[top[0]].voters.push(`Pubblico (${max} su ${av.length})`); total++; }
  }
  if (m.final){
    Object.values(R).forEach(r => r.pts = r.votes * 500);
    if (m.forfeit) R[m.forfeit].pts = 1000;
  } else {
    const base = 1000 * H.round;
    if (m.forfeit) R[m.forfeit].pts = base;
    else if (m.jinx) {}
    else if (total === 0){ m.novotes = true; m.players.forEach(id => R[id].pts = Math.round(base/2)); }
    else {
      m.players.forEach(id => R[id].pts = Math.round(base * R[id].votes / total));
      const w = m.players.find(id => R[id].votes === total);
      if (w){ R[w].pts += 250 * H.round; m.cappotto = w; }
    }
  }
  m.R = R;
  Object.entries(R).forEach(([id, r]) => { const p = byId(id); if (p) p.score += r.pts; });
}
function isWinner(m, id){
  if (!m.R) return false;
  if (m.forfeit) return id === m.forfeit;
  if (m.jinx) return false;
  const max = Math.max(...Object.values(m.R).map(r => r.votes));
  return max > 0 && m.R[id].votes === max;
}
function showScores(){ clearTimer(); H.phase = 'scores'; renderHost(); broadcast(); }
function endGame(){ clearTimer(); H.phase = 'end'; renderHost(); broadcast(); }
function nextRound(){ H.round++; startRound(); }
// l'host torna alla homepage: chiude la stanza e avvisa chi era entrato
function closeRoom(){
  const others = [...H.players, ...H.audience].filter(p => p.conn !== LOCAL && p.connected).length;
  if (others){
    const who = others === 1 ? 'il giocatore entrato verrà fatto uscire' : `i ${others} giocatori entrati verranno fatti uscire`;
    if (!confirm(`Vuoi chiudere la stanza ${H.code} e tornare alla homepage? ${who.charAt(0).toUpperCase() + who.slice(1)}.`)) return;
  }
  [...H.players, ...H.audience].forEach(p => { if (p.conn !== LOCAL) send(p.conn, {t:'closed'}); });
  clearTimer();
  const old = H.peer;
  setTimeout(() => { try { if (old) old.destroy(); } catch(e){} }, 400);   // il tempo di far arrivare l'avviso
  Object.assign(H, {peer:null, code:'', players:[], audience:[], banned:new Set(), phase:'lobby', round:0, matchups:[], cur:-1, me:null});
  lastKey = '';   // la prossima stanza va ridisegnata da zero
  home();
}
// l'host fa uscire un giocatore (o uno del pubblico): non potrà rientrare in questa stanza
function kick(id){
  const p = H.players.find(x => x.id === id) || H.audience.find(x => x.id === id);
  if (!p || p.conn === LOCAL || H.phase !== 'lobby') return;
  if (!confirm(`Vuoi far uscire ${p.name} dalla stanza? Non potrà rientrare in questa stanza.`)) return;
  if (p.tok) H.banned.add(p.tok);
  send(p.conn, {t:'kicked'});
  const c = p.conn; setTimeout(() => { try { c.close(); } catch(e){} }, 300);
  H.players = H.players.filter(x => x !== p); H.audience = H.audience.filter(x => x !== p);
  broadcast(); renderHost();
}
// l'host passa il ruolo a un altro giocatore: la stanza (stesso codice) si sposta sul suo telefono
function makeHost(id){
  const p = H.players.find(x => x.id === id);
  if (!p || p.conn === LOCAL || !p.connected || H.phase !== 'lobby') return;
  const meName = H.me ? (byId(H.me.id) || {}).name : '';
  if (!confirm(`Vuoi passare il ruolo di host a ${p.name}? La stanza ${H.code} resta la stessa e tutti si ricollegano da soli.${meName ? ' Tu resterai nella stanza come giocatore.' : ''}`)) return;
  readSettings();
  send(p.conn, {t:'becomeHost', state:{code:H.code, settings:H.settings, customRaw:H.customRaw, onlyCustom:H.onlyCustom, banned:[...H.banned]}});
  [...H.players, ...H.audience].forEach(x => { if (x !== p && x.conn !== LOCAL) send(x.conn, {t:'moving', host:p.name}); });
  const code = H.code, old = H.peer;
  clearTimer();
  Object.assign(H, {peer:null, code:'', players:[], audience:[], banned:new Set(), phase:'lobby', round:0, matchups:[], cur:-1, me:null});
  lastKey = ''; window.onbeforeunload = null;
  setTimeout(() => { try { if (old) old.destroy(); } catch(e){} }, 500);   // libero il codice per il nuovo host
  if (!meName) return home();
  // il vecchio host rientra come giocatore
  MODE = 'player'; P.code = code; P.name = meName; P.stop = false; P.tries = 0; P.resuming = false; P.moving = p.name;
  reconnectScreen(false);
  setTimeout(() => { P.tries = 0; autoReconnect(); }, 1500);
}
// questo telefono diventa l'host della stanza
function takeOverHost(name, st){
  H.settings = Object.assign({}, H.settings, st.settings || {});
  H.customRaw = st.customRaw || ''; H.custom = parseCustom(H.customRaw); H.onlyCustom = !!st.onlyCustom && H.custom.length > 0;
  H.players = []; H.audience = []; H.banned = new Set(st.banned || []);
  hostStart(name, st.code, 0);
}
function playAgain(){
  clearTimer();
  H.players = H.players.filter(p => p.connected);
  H.players.forEach(p => p.score = 0);
  const promote = H.audience.filter(a => a.connected).slice(0, Math.max(0, 10 - H.players.length));
  promote.forEach(a => {
    const used = H.players.map(x => x.color);
    H.players.push({id:'p' + (++H.seq), name:a.name, score:0, conn:a.conn, connected:true, tok:a.tok, seen:a.seen, hb:a.hb,
      color: COLORS.find(c => !used.includes(c)) || COLORS[0]});
  });
  H.audience = H.audience.filter(a => a.connected && !promote.includes(a));
  H.round = 0; H.matchups = []; H.cur = -1; H.phase = 'lobby';
  renderHost(true); broadcast();
}

/* --- viste dei telefoni (calcolate dall'host) --- */
function viewFor(p){
  const v = {name:p.name, score:p.score, color:p.color,
             left: H.timerEnd ? Math.max(0, H.timerEnd - Date.now()) : 0, total: H.timerTotal};
  const W = (emoji, title, msg) => Object.assign(v, {type:'wait', emoji, title, msg});
  switch (H.phase){
    case 'lobby': return Object.assign(v, {type:'lobby', code:H.code, players:H.players.map(x => ({name:x.name, color:x.color, host:!!x.host, me:x.id === p.id})), audience:H.audience.map(a => a.name)});
    case 'intro': return W('🔥', H.round < 3 ? 'Round ' + H.round : 'Round finale', introText());
    case 'answer': {
      const mine = H.matchups.map((m, i) => ({m, i})).filter(x => x.m.players.includes(p.id));
      const todo = mine.filter(x => !x.m.answers[p.id]);
      const status = H.players.map(x => ({name:x.name, color:x.color, host:!!x.host, me:x.id === p.id, off:!x.connected,
        done: H.matchups.every(m => !m.players.includes(x.id) || m.answers[x.id]),
        n: H.matchups.filter(m => m.players.includes(x.id) && m.answers[x.id]).length,
        tot: H.matchups.filter(m => m.players.includes(x.id)).length}));
      if (!todo.length) return Object.assign(W('✅', 'Fatto!', 'Aspetta che finiscano gli altri…'), {status});
      return Object.assign(v, {type:'answer', prompts: todo.map(x => ({mid:x.i, text:x.m.prompt})), done: mine.length - todo.length, tot: mine.length, status});
    }
    case 'vote': {
      const m = cur();
      if (!canVote(p, m)){
        const aud = Object.values(m.aud || {});
        const opts = (m.order || answered(m)).map(id => ({parts: m.answers[id], votes: Object.values(m.votes).filter(c => c === id).length, aud: aud.filter(c => c === id).length, mine: id === p.id}));
        return Object.assign(v, {type:'tally', prompt:m.prompt, options:opts, voted:Object.keys(m.votes).length + aud.length,
          voters:elig(m).filter(x => x.connected).length + H.audience.filter(a => a.connected).length});
      }
      if (m.votes[p.id]) return Object.assign(W('✅', 'Voto registrato!', 'Aspetta gli altri: tra poco scopriamo chi vince.'), {mode:'vote'});
      const opts = (m.order || answered(m)).filter(id => id !== p.id).map(id => ({id, parts: m.answers[id]}));
      return Object.assign(v, {type:'vote', prompt:m.prompt, options:opts});
    }
    case 'show': {
      const m = cur();
      return Object.assign(v, {type:'show', prompt:m.prompt, step:revealStep(m), mine: !m.final && m.players.includes(p.id),
        answers: m.order.map(id => ({parts:m.answers[id], mine:id === p.id}))});
    }
    case 'winner': {
      const m = cur(), w = winnersOf(m), wt = winnerText(m);
      let mine = '';
      if (w.includes(p.id)) mine = w.length > 1 ? 'Pareggio: sei tra i vincitori!' : 'Hai vinto la sfida!';
      else if (m.answers[p.id]) mine = 'Sfida persa… ti rifarai alla prossima!';
      const ids = answered(m).slice().sort((a, b) => (w.includes(b) - w.includes(a)) || (m.R[b].votes - m.R[a].votes));
      return Object.assign(v, {type:'winner', next:nextLabel(), title:wt.title, sub:wt.sub, mine, prompt:m.prompt,
        cards: ids.map(id => { const a = byId(id), r = m.R[id];
          return {parts:m.answers[id], name:a.name, color:a.color, votes:r.votes, voters:r.voters, win:w.includes(id), mine:id === p.id}; })});
    }
    case 'points': {
      const m = cur(), gains = {};
      answered(m).forEach(id => gains[id] = m.R[id].pts);
      const r = m.R && m.R[p.id];
      const title = r && m.answers[p.id] ? (r.pts > 0 ? '+' + r.pts + ' punti!' : 'Zero punti in questa sfida') : 'Risultati della sfida';
      const gl = answered(m).sort((a, b) => m.R[b].pts - m.R[a].pts).map(id => { const a = byId(id);
        return {name:a.name, color:a.color, votes:m.R[id].votes, pts:m.R[id].pts, cappotto:m.cappotto === id, me:id === p.id}; });
      return Object.assign(v, {type:'board', next:nextLabel(), title, gains:gl, board:boardData(p, gains)});
    }
    case 'scores': return W('📊', 'Sei ' + rank(p) + '°', `Hai ${p.score} punti. Guarda la classifica sullo schermo.`);
    case 'end': {
      const s = sorted(), top = s.filter(x => x.score === s[0].score), rk = rank(p);
      const title = top.length > 1 ? 'Pareggio finale!' : '🏆 ' + top[0].name + ' vince la partita!';
      return Object.assign(v, {type:'board', final:true, title, sub: rk === 1 ? 'Sei primo! Complimenti!' : `Sei arrivato ${rk}° con ${p.score} punti.`, gains:[], board:boardData(p)});
    }
    default: return W('👀', 'Guarda lo schermo!', '');
  }
}
function sendView(p){ if (p.connected) send(p.conn, {t:'view', v:viewFor(p)}); }
// il pubblico vede le stesse schermate, ma non scrive e ha un solo voto collettivo
function viewForAud(a){
  const v = viewFor({id:a.id, name:a.name, score:0, color:AUD_COLOR});
  v.aud = true;
  const W = (emoji, title, msg) => Object.assign(v, {type:'wait', emoji, title, msg});
  if (H.phase === 'lobby') return W('🍿', 'Sei nel pubblico', 'La stanza è piena: guarderai le sfide e voterai. Alla prossima partita, se si libera un posto, giochi anche tu.');
  if (H.phase === 'answer') return W('🍿', 'Sei nel pubblico', 'I giocatori stanno scrivendo: tra poco voti anche tu.');
  if (H.phase === 'vote' && (cur().aud || {})[a.id]) return Object.assign(W('✅', 'Voto registrato!', 'Il pubblico vota insieme: la risposta più votata da voi prende un voto in più.'), {mode:'vote'});
  if (H.phase === 'end') v.sub = 'Grazie per aver fatto il tifo dal pubblico! Alla prossima partita giochi anche tu.';
  return v;
}
function sendAudView(a){ if (a.connected) send(a.conn, {t:'view', v:viewForAud(a)}); }
function broadcast(){ H.players.forEach(sendView); H.audience.forEach(sendAudView); }

/* --- rendering dello schermo host --- */
let lastKey = '';
const VIEW = {}, UPD = {};
function renderHost(force){
  if (MODE !== 'host') return;
  // Host che gioca: fuori dalla lobby ha le stesse schermate dei giocatori + una barra di controllo
  if (H.me && H.phase !== 'lobby'){
    if (force || !document.getElementById('hp')){
      lastKey = '';
      app.innerHTML = `<div class="screen phone"><div id="hp" class="hp"></div><div id="hbar" class="hbar"></div></div>`;
    }
    drawHP(); drawBar(); return;
  }
  const key = H.phase + '|' + H.round + '|' + H.cur;
  if (!force && key === lastKey && UPD[H.phase]){ UPD[H.phase](); return; }
  if (key !== lastKey) screenSound();
  lastKey = key;
  (VIEW[H.phase] || (() => {}))();

const P = {peer:null, conn:null, name:'', code:'', joined:false, lastKey:'', localEnd:0, total:0};

function joinScreen(err){
  MODE = 'player'; window.onbeforeunload = null; document.body.dataset.mode = '';
  const qs = new URLSearchParams(location.search);

      <label>Il tuo nome<input id="jname" maxlength="16" autocomplete="off" value="${esc(name)}" placeholder="Es. Pietro"></label>
      <button class="btn big" id="jgo">Entra</button>
    </div>
    <button class="link" id="jback">← Indietro</button></div>`;
  const go = () => {
    const c = $('#jcode').value.trim().toUpperCase().replace(/[^A-Z]/g, ''), n = $('#jname').value.trim();
    if (c.length !== 4){ $('#jcode').classList.add('shake'); setTimeout(() => $('#jcode') && $('#jcode').classList.remove('shake'), 400); return; }
    if (!n){ $('#jname').classList.add('shake'); setTimeout(() => $('#jname') && $('#jname').classList.remove('shake'), 400); return; }
    P.code = c; P.name = n; P.resuming = false; store('tb_code', c); store('tb_name', n);
    connect();
  };
  $('#jgo').onclick = go;
  $('#jname').onkeydown = e => { if (e.key === 'Enter') go(); };
  $('#jback').onclick = () => { P.stop = true; cleanupPlayer(); clearSess(); history.replaceState(null, '', location.pathname); home(); };
  if (!code) $('#jcode').focus(); else if (!name) $('#jname').focus();
}

const MAX_TRIES = 8;              // tentativi di riconnessione automatica
const SESS_MAX = 3 * 60 * 60 * 1000; // per quanto tempo si può rientrare dopo un crash
// chiave segreta del dispositivo: l'host riconosce chi rientra anche se la vecchia connessione sembra ancora aperta
function myTok(){ let t = load('tb_tok'); if (!t){ t = Math.random().toString(36).slice(2) + Date.now().toString(36); store('tb_tok', t); } return t; }
// partita in corso salvata sul telefono: serve per rientrare dopo un crash o una ricarica della pagina
function saveSess(){ if (P.code && P.name) store('tb_sess', JSON.stringify({code:P.code, name:P.name, ts:Date.now(), pre:PREFIX})); }
function loadSess(){ try { const x = JSON.parse(load('tb_sess') || 'null'); return x && x.code && x.name && x.pre === PREFIX && Date.now() - x.ts < SESS_MAX ? x : null; } catch(e){ return null; } }
function clearSess(){ store('tb_sess', ''); }

function cleanupPlayer(){
  const pe = P.peer;
  P.conn = null; P.peer = null; P.joined = false; P.lastKey = ''; P.hbOK = false;
  if (pe) try { pe.destroy(); } catch(e){}
}

function connect(retry){
  if (typeof Peer === 'undefined') return joinScreen('Impossibile caricare la libreria di rete.');
  cleanupPlayer();
  if (!retry){ P.tries = 0; P.stop = false; app.innerHTML = spinner('Mi collego alla stanza ' + P.code + '…'); }
  const peer = new Peer(); P.peer = peer;
  // tentativo fallito: in riconnessione si riprova, altrimenti si torna al modulo
  const fail = msg => {
    if (P.peer !== peer) return;
    clearTimeout(to); cleanupPlayer();
    if (retry) setTimeout(autoReconnect, 2500); else joinScreen(msg);
  };
  const to = setTimeout(() => { if (P.peer === peer && !P.joined) fail('Non riesco a collegarmi. Controlla il codice e riprova.'); }, 12000);
  peer.on('open', () => {
    if (P.peer !== peer) return;
    const conn = peer.connect(PREFIX + P.code, {reliable:true}); P.conn = conn;
    conn.on('open', () => conn.send({t:'join', name:P.name, tok:myTok()}));
    conn.on('data', d => { P.lastPong = Date.now(); playerMsg(d, to); });
    conn.on('close', () => { if (P.conn !== conn) return; if (P.joined) lostConn(); else fail('Connessione interrotta. Riprova.'); });
  });
  peer.on('disconnected', () => { try { if (P.peer === peer) peer.reconnect(); } catch(e){} });
  peer.on('error', e => {
    if (P.peer !== peer) return;
    if (e.type === 'peer-unavailable'){
      // la stanza non esiste (più): in riconnessione riprovo una volta, poi mi arrendo
      clearTimeout(to); cleanupPlayer();
      if (retry && (P.tries < 2 || P.moving)) return setTimeout(autoReconnect, 1500);   // durante il cambio di host il codice torna disponibile dopo poco
      clearSess(); P.stop = true;
      return joinScreen(retry ? "La partita non c'è più: l'host ha chiuso la stanza." : 'Stanza non trovata. Controlla il codice.');
    }
    if (!P.joined) fail('Errore di connessione (' + e.type + '). Riprova.');
  });
}

// la connessione è caduta dopo essere entrati: si riprova da soli
function lostConn(){
  if (MODE !== 'player') return;
  cleanupPlayer(); P.tries = 0;
  autoReconnect();
}
function autoReconnect(){
  if (MODE !== 'player' || P.stop || P.peer) return;
  P.tries = (P.tries || 0) + 1;
  if (P.tries > MAX_TRIES) return reconnectScreen(true);
  reconnectScreen(false);
  connect(true);
}
function reconnectScreen(gaveUp){
  const title = gaveUp ? 'Non riesco a riconnettermi' : P.moving ? 'Cambio di host' : P.resuming ? 'Rientro nella partita' : 'Connessione persa';
  const msg = gaveUp ? 'Controlla la connessione internet e riprova: rientrerai con lo stesso nome e riprenderai da dove eri.'
    : P.moving ? `<b>${esc(P.moving)}</b> diventa l'host: mi ricollego alla stanza <b>${esc(P.code)}</b>…`
    : `Mi sto ricollegando alla stanza <b>${esc(P.code)}</b> come <b>${esc(P.name)}</b>…`;
  app.innerHTML = `<div class="screen phone center"><div class="emoji">${gaveUp ? '😵' : '📡'}</div><h2>${title}</h2>
    <p class="lead">${msg}</p>
    ${gaveUp ? '' : `<div class="spinner"></div><p class="muted small">Tentativo ${P.tries} di ${MAX_TRIES}</p>`}
    <button class="btn big" id="rc">${gaveUp ? 'Riprova' : 'Riprova subito'}</button>
    <button class="link" id="ch">Esci dalla partita</button></div>`;
  document.body.dataset.mode = '';
  $('#rc').onclick = () => { cleanupPlayer(); P.stop = false; P.tries = 0; autoReconnect(); };
  $('#ch').onclick = () => { P.stop = true; P.resuming = false; cleanupPlayer(); clearSess(); joinScreen(); };
}
// riapertura della pagina dopo un crash: rientra da solo nella partita salvata
function resumeSess(x){
  MODE = 'player'; P.code = x.code; P.name = x.name; P.stop = false; P.tries = 0; P.resuming = true;
  autoReconnect();
}

// controllo di presenza dal telefono: se l'host non risponde da 14 secondi, la connessione è morta
setInterval(() => {
  if (MODE !== 'player' || !P.joined || !P.conn) return;
  if (P.hbOK && Date.now() - (P.lastPong || 0) > 14000){ const c = P.conn; P.conn = null; try { c.close(); } catch(e){} return lostConn(); }
  send(P.conn, {t:'ping'});
}, 4000);
// quando torni sull'app dopo averla lasciata in background: controllo subito che la connessione sia viva
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible' || MODE !== 'player' || P.stop || !P.code) return;
  if (P.joined && P.conn && P.conn.open){
    const t0 = Date.now(); send(P.conn, {t:'ping'});
    setTimeout(() => {
      if (MODE === 'player' && P.joined && P.hbOK && P.conn && (P.lastPong || 0) < t0){ const c = P.conn; P.conn = null; try { c.close(); } catch(e){} lostConn(); }
    }, 3000);
    return;
  }
  if (P.peer) return;            // sta già provando a collegarsi
  P.tries = 0; autoReconnect();
});

function playerMsg(d, to){
  if (!d || typeof d !== 'object') return;
  if (d.t === 'err'){ clearTimeout(to); cleanupPlayer(); clearSess(); P.stop = true; P.resuming = false; return joinScreen(d.msg); }
  if (d.t === 'joined'){ clearTimeout(to); P.joined = true; P.name = d.name; P.tries = 0; P.resuming = false; P.moving = ''; store('tb_name', d.name); saveSess(); return; }
  if (d.t === 'pong'){ P.hbOK = true; return; }
  if (d.t === 'kicked'){ clearTimeout(to); P.stop = true; P.resuming = false; cleanupPlayer(); clearSess(); return joinScreen("L'host ti ha fatto uscire dalla stanza."); }
  if (d.t === 'moving'){ P.moving = d.host; return; }
  if (d.t === 'becomeHost'){ clearTimeout(to); P.stop = true; P.moving = ''; const nm = P.name; cleanupPlayer(); clearSess(); return takeOverHost(nm, d.state); }
  if (d.t === 'closed'){ clearTimeout(to); P.stop = true; P.resuming = false; cleanupPlayer(); clearSess(); return joinScreen("L'host ha chiuso la stanza. Chiedigli il nuovo codice per rientrare."); }
  if (d.t === 'renamed'){ P.name = d.name; store('tb_name', d.name); saveSess(); return; }
  if (d.t === 'renameErr'){ const e = app.querySelector('[data-rmsg]'); if (e){ e.className = 'rmsg bad'; e.textContent = d.msg; } const b = app.querySelector('[data-rsave]'); if (b) b.disabled = false; return; }
  if (d.t === 'view') renderPlayer(d.v);
}

function lobbyPlayers(v){
  return `<div class="muted">Giocatori nella stanza ${esc(v.code)} (${v.players.length})</div>
    <div class="chips">${v.players.map(x => `<span class="chip ${x.me ? 'mechip' : ''}" style="background:${x.color}">${x.host ? '👑 ' : ''}${esc(x.name)}${x.me ? ' (tu)' : ''}</span>`).join('')}</div>
    ${v.audience && v.audience.length ? `<div class="muted small">🍿 Pubblico: ${v.audience.map(esc).join(', ')}</div>` : ''}`;
}
function statusInner(st){
  const writing = st.filter(x => !x.done), done = st.filter(x => x.done);
  const row = x => `<div class="wrow ${x.done ? 'done' : 'writing'} ${x.me ? 'me' : ''}">
      <span class="dot" style="background:${x.color}"></span>
      <span class="wname">${x.host ? '👑 ' : ''}${esc(x.name)}${x.me ? ' (tu)' : ''}</span>
      <span class="wstate">${x.off ? '📡 disconnesso' : x.done ? '✅ ha finito'
        : `✍️ sta scrivendo${x.tot > 1 ? ` · ${x.n}/${x.tot} frasi` : ''}<span class="dots"><i>.</i><i>.</i><i>.</i></span>`}</span>
    </div>`;
  return `<div class="wsum">✍️ ${writing.length} stanno scrivendo · ✅ ${done.length} hanno finito</div>
    ${writing.map(row).join('')}${done.map(row).join('')}`;
}
const statusBlock = v => v.status ? `<div class="wstatus" data-status>${statusInner(v.status)}</div>` : '';
// aggiorna solo il riquadro "chi sta scrivendo" senza toccare i campi di testo
function updStatus(root, v){
  const el = root.querySelector('[data-status]'); if (el && v.status) el.innerHTML = statusInner(v.status);
  const pl = root.querySelector('[data-players]'); if (pl && v.players) pl.innerHTML = lobbyPlayers(v);
}
const viewKey = v => JSON.stringify(Object.assign({}, v, {left:0, status:0, players:0}));

function playerBody(v, panel){
  if (v.type === 'wait'){
    if (panel) return `<div class="mewait"><span class="emoji">${v.emoji || '👀'}</span><div><b>${esc(v.title)}</b><br><span class="muted" style="color:#6b5b9a">${esc(v.msg || '')}</span></div></div>`;
    return `<div class="grow"><div class="emoji">${v.emoji || '👀'}</div><h2 style="font-size:28px">${esc(v.title)}</h2><p class="lead">${esc(v.msg || '')}</p>${v.status ? timerHTML() : ''}</div>${statusBlock(v)}`;
  }
  if (v.type === 'answer'){
    const q = v.prompts[0], n = Math.max(1, blanks(q.text));
    return `${panel ? '' : timerHTML()}
      <div class="${panel ? '' : 'muted '}small">Frase ${v.done + 1} di ${v.tot}</div>
      <div class="${panel ? '' : 'card'}"><div class="prompt" data-prev>${fill(q.text)}</div></div>
      <div class="inputs">${Array.from({length:n}, (_, i) =>
        `<input class="ans" maxlength="45" autocomplete="off" enterkeyhint="${i === n-1 ? 'send' : 'next'}" placeholder="${n > 1 ? 'Buco ' + (i+1) : 'La tua risposta'}">`).join('')}</div>
      <button class="btn big" data-send>Invia</button>
      ${panel ? '' : statusBlock(v)}`;
  }
  if (v.type === 'lobby'){
    return `<div class="grow"><div class="emoji">🎉</div><h2 style="font-size:28px">Sei dentro!</h2>
      <p class="lead">Aspetta che l'host avvii la partita.</p>
      <div class="rename">
        <div class="rcur">Il tuo nome: <b>${esc(v.name)}</b> <button class="btn small ghost" data-redit>✏️ Cambia nome</button></div>
        <div class="rform" data-rform hidden>
          <div class="rrow"><input data-rname maxlength="16" autocomplete="off" value="${esc(v.name)}" aria-label="Nuovo nome">
          <button class="btn small alt" data-rsave>Salva</button></div>
          <button class="link" data-rcancel>Annulla</button>
        </div>
        <div class="rmsg" data-rmsg></div>
      </div>
      <div data-players>${lobbyPlayers(v)}</div></div>`;
  }
  if (v.type === 'show'){
    return `<div class="pbanner" style="font-size:22px">${v.mine ? '🥊 È la tua sfida!' : 'Ecco le risposte…'}</div>
      <div class="opts">${v.answers.map((a, i) => `<div class="pcard reveal ${a.mine ? 'mineb' : ''}" style="--c:${a.mine ? 'var(--pink)' : '#fff'};animation-delay:${(0.8 + i * v.step).toFixed(2)}s">
        ${a.mine ? '<span class="tag">LA TUA</span> ' : ''}${fill(v.prompt, a.parts)}</div>`).join('')}</div>
      <p class="muted small" style="text-align:center">Tra poco si vota!</p>`;
  }
  if (v.type === 'winner'){
    return `${v.next ? nextBarHTML(v.next) : ''}<div class="pbanner">${esc(v.title)}</div>
      ${v.sub ? `<p class="lead" style="text-align:center">${esc(v.sub)}</p>` : ''}
      ${v.mine ? `<div class="mymsg">${esc(v.mine)}</div>` : ''}
      <div class="opts">${v.cards.map(c => `<div class="pcard ${c.win ? 'win' : 'lose'}" style="--c:${c.color}">
        ${c.win ? '<span class="tag">VINCE</span> ' : ''}${fill(v.prompt, c.parts)}
        <div class="ameta"><span class="aname" style="background:${c.color}">${esc(c.name)}${c.mine ? ' (tu)' : ''}</span>
        <span class="votes">${c.votes} vot${c.votes === 1 ? 'o' : 'i'}</span>
        ${c.voters.length ? `<div class="voters">Votato da: ${c.voters.map(esc).join(', ')}</div>` : ''}</div></div>`).join('')}</div>`;
  }
  if (v.type === 'board'){
    return `${v.next ? nextBarHTML(v.next) : ''}<div class="pbanner">${esc(v.title)}</div>
      ${v.sub ? `<p class="lead" style="text-align:center">${esc(v.sub)}</p>` : ''}
      ${v.gains.length ? `<h3>Punti della sfida</h3><div class="gains">${v.gains.map(g => `<div class="gain small ${g.me ? 'me' : ''}">
        <span class="aname" style="background:${g.color}">${esc(g.name)}</span>
        <span class="muted">${g.votes} vot${g.votes === 1 ? 'o' : 'i'}</span>${g.cappotto ? '<span class="tag">CAPPOTTO</span>' : ''}
        <span class="gpts">+${g.pts}</span></div>`).join('')}</div>` : ''}
      <h3>${v.final ? 'Classifica finale' : 'Classifica generale'}</h3>
      <div class="pboard">${v.board.map(b => `<div class="prow ${b.me ? 'me' : ''}">
        <span class="ppos">${b.rank === 1 ? '🥇' : b.rank === 2 ? '🥈' : b.rank === 3 ? '🥉' : b.rank + '.'}</span>
        <span class="dot" style="background:${b.color}"></span>
        <span class="pname">${b.host ? '👑 ' : ''}${esc(b.name)}${b.me ? ' (tu)' : ''}${b.delta ? ` <span class="delta">+${b.delta}</span>` : ''}</span>
        <span class="bpts">${b.score}</span></div>`).join('')}</div>`;
  }
  if (v.type === 'tally'){
    // SCHERMATA "È LA TUA SFIDA": solo lettura, voti in tempo reale
    const tot = Math.max(1, v.voted);
    return `${panel ? '' : timerHTML()}
      <div class="modehead fight"><div class="mt">🥊 È la tua sfida!</div>
        <div class="ms">🔒 Non puoi votare: guarda come votano gli altri</div></div>
      <div class="opts">${v.options.map(o => `<div class="opt tally ${o.mine ? 'mine' : 'rival'}">
        <span class="tag ${o.mine ? '' : 'grey'}">${o.mine ? 'LA TUA' : 'AVVERSARIO'}</span>
        <div style="margin-top:8px">${fill(v.prompt, o.parts)}</div>
        <div class="tbarv"><div style="width:${((o.votes + (o.aud || 0)) / tot * 100).toFixed(0)}%"></div></div>
        <div class="tcount">${o.votes} vot${o.votes === 1 ? 'o' : 'i'}${o.aud ? ` · pubblico ${o.aud}` : ''}</div></div>`).join('')}</div>
      <div class="votedcount">${v.voted}/${v.voters} hanno votato</div>`;
  }
  if (v.type === 'vote'){
    // SCHERMATA "TOCCA A TE VOTARE": risposte cliccabili con lettera
    if (panel) return `<div class="mewait"><span class="emoji">👆</span><div><b>Tocca la risposta che ti fa più ridere</b></div></div>`;
    return `${timerHTML()}
      <div class="modehead vote"><div class="mt">🗳️ Tocca a te votare!</div>
        <div class="ms">Scegli la risposta che ti fa più ridere</div></div>
      <div class="opts">${v.options.map((o, i) => `<button class="opt votebtn" data-id="${esc(o.id)}">
        <span class="optletter">${'ABCDEFGHIJ'[i]}</span><span>${fill(v.prompt, o.parts)}</span></button>`).join('')}</div>`;
  }
  return '';
}

function modeOf(v){
  if (v.type === 'vote' || v.mode === 'vote') return 'vote';
  if (v.type === 'tally' || (v.type === 'show' && v.mine)) return 'fight';
  return '';
}
function setMode(v){ document.body.dataset.mode = modeOf(v); }

function wirePlayer(root, v, sendFn){
  if (v.type === 'lobby'){
    const form = root.querySelector('[data-rform]'), cur = root.querySelector('.rcur'), inp = root.querySelector('[data-rname]');
    const msg = root.querySelector('[data-rmsg]'), save = root.querySelector('[data-rsave]');
    root.querySelector('[data-redit]').onclick = () => { form.hidden = false; cur.hidden = true; msg.textContent = ''; inp.focus(); inp.select(); };
    root.querySelector('[data-rcancel]').onclick = () => { form.hidden = true; cur.hidden = false; msg.textContent = ''; inp.value = v.name; };
    const go = () => {
      const n = inp.value.trim();
      if (!n){ msg.className = 'rmsg bad'; msg.textContent = 'Scrivi un nome.'; inp.focus(); return; }
      if (n === v.name){ form.hidden = true; cur.hidden = false; return; }
      save.disabled = true; msg.className = 'rmsg'; msg.textContent = 'Salvo…';
      sendFn({t:'rename', name:n});
    };
    save.onclick = go;
    inp.onkeydown = e => { if (e.key === 'Enter') go(); };
    return;
  }
  if (v.type === 'answer'){
    const q = v.prompts[0];
    const ins = [...root.querySelectorAll('.ans')];
    const prev = root.querySelector('[data-prev]'), btn = root.querySelector('[data-send]');
    const vals = () => ins.map(i => i.value.trim());
    ins.forEach((inp, i) => {
      inp.oninput = () => { prev.innerHTML = fill(q.text, vals()); };
      inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); if (ins[i+1]) ins[i+1].focus(); else btn.click(); } };
    });
    if (ins[0]) ins[0].focus();
    btn.onclick = () => {
      const empty = ins.find(i => !i.value.trim());
      if (empty){ empty.classList.add('shake'); empty.focus(); setTimeout(() => empty.classList.remove('shake'), 400); return; }
      btn.disabled = true;
      sendFn({t:'answer', mid:q.mid, parts:vals()});
    };
  } else if (v.type === 'vote'){
    root.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      root.querySelectorAll('.opt').forEach(x => x.disabled = true);
      b.classList.add('sel');
      sendFn({t:'vote', choice:b.dataset.id});
    });
  }
}

function renderPlayer(v){
  if (Date.now() - (P.sessTs || 0) > 30000){ P.sessTs = Date.now(); saveSess(); }
  P.localEnd = v.left ? Date.now() + v.left : 0; P.total = v.total || 0;
  const key = viewKey(v);
  if (key === P.lastKey){ updStatus(app, v); return; }
  P.lastKey = key;
  const top = `<div class="ptop"><span class="dot" style="background:${v.color}"></span><b>${esc(v.name)}</b><span class="pscore">${v.aud ? '🍿 Pubblico' : v.score + ' pt'}</span></div>`;
  app.innerHTML = `<div class="screen phone">${top}${playerBody(v, false)}</div>`;
  setMode(v); soundFor(v);
  wirePlayer(app, v, d => send(P.conn, d));
}

/* ===================== SUONI E VIBRAZIONE ===================== */
// suoni generati al momento (niente file da scaricare); si spengono dal pulsante in fondo alla pagina
const SND = {on: load('tb_sound') !== 'off', ctx:null, noise:null, last:'', cur:'', tick:0};
function actx(){
  if (!SND.on) return null;
  try {
    if (!SND.ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; SND.ctx = new C(); }
    if (SND.ctx.state === 'suspended') SND.ctx.resume();
    return SND.ctx;
  } catch(e){ return null; }
}
// i browser attivano l'audio solo dopo un tocco
['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (SND.on) actx(); }, {passive:true}));
function tone(freq, at, dur, o = {}){
  const c = actx(); if (!c) return;
  try {
    const t = c.currentTime + at, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine'; osc.frequency.setValueAtTime(freq, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(freq * o.slide, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.vol || 0.12, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(c.destination); osc.start(t); osc.stop(t + dur + 0.05);
  } catch(e){}
}
function clap(at, vol){
  const c = actx(); if (!c) return;
  try {
    if (!SND.noise){ const b = c.createBuffer(1, c.sampleRate, c.sampleRate), d = b.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; SND.noise = b; }
    const t = c.currentTime + at, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = SND.noise; f.type = 'bandpass'; f.frequency.value = 1200 + Math.random() * 1500; f.Q.value = 0.8;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    src.connect(f); f.connect(g); g.connect(c.destination); src.start(t, Math.random() * 0.8, 0.15);
  } catch(e){}
}
const SFX = {
  jingle(){ [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.2, {type:'square', vol:0.05})); },
  ding(at){ tone(880, at, 0.25, {type:'triangle', vol:0.16}); tone(1320, at + 0.06, 0.3, {type:'triangle', vol:0.08}); },
  tick(last){ tone(last ? 1250 : 950, 0, 0.06, {type:'square', vol:0.05}); },
  pop(){ tone(520, 0, 0.14, {vol:0.16, slide:1.7}); },
  fanfare(){ [[523,0],[659,.12],[784,.24],[1047,.36],[784,.54],[1047,.66]].forEach(([f, d]) => tone(f, d, 0.3, {type:'sawtooth', vol:0.045})); },
  applause(){ for (let i = 0; i < 45; i++) clap(Math.random() * 1.8, 0.04 + Math.random() * 0.06); },
  buzz(){ tone(150, 0, 0.5, {type:'sawtooth', vol:0.09}); tone(142, 0.02, 0.5, {type:'square', vol:0.05}); }
};
function vibrate(p){ try { if (SND.on && navigator.vibrate) navigator.vibrate(p); } catch(e){} }
// suono per ogni nuova schermata (telefoni e host che gioca)
function soundFor(v){
  SND.cur = v.status ? 'answer' : v.type;
  const k = v.type + '|' + (v.prompt || '') + '|' + (v.title || '') + '|' + (v.final ? 1 : 0);
  if (k === SND.last) return; SND.last = k;
  if (v.type === 'show'){ SFX.jingle(); v.answers.forEach((a, i) => SFX.ding(0.8 + i * v.step)); }
  else if (v.type === 'vote'){ SFX.pop(); vibrate([80, 60, 80]); }
  else if (v.type === 'winner'){
    if (/Stessa risposta/.test(v.title)) SFX.buzz();
    else { SFX.fanfare(); if (/CAPPOTTO/.test(v.sub || '')) setTimeout(() => SFX.applause(), 600); }
    if (/Hai vinto|tra i vincitori/.test(v.mine || '')) vibrate(250);
  }
  else if (v.type === 'board' && v.final){ SFX.fanfare(); setTimeout(() => SFX.applause(), 700); }
  else if (v.type === 'wait' && /^Round/.test(v.title || '')) SFX.jingle();
}
// suoni dello schermo dell'host quando non gioca (modalità "solo schermo")
function screenSound(){
  if (H.me) return;
  const m = cur();
  SND.cur = H.phase;
  if (H.phase === 'intro') SFX.jingle();
  else if (H.phase === 'show' && m){ SFX.jingle(); m.order.forEach((id, i) => SFX.ding(1 + i * revealStep(m))); }
  else if (H.phase === 'vote') SFX.pop();
  else if (H.phase === 'winner' && m){ if (m.jinx) SFX.buzz(); else { SFX.fanfare(); if (m.cappotto) setTimeout(() => SFX.applause(), 600); } }
  else if (H.phase === 'end'){ SFX.fanfare(); setTimeout(() => SFX.applause(), 700); }
}

/* ===================== TIMER VISIVO ===================== */
setInterval(() => {
  const num = document.getElementById('tnum'); if (!num) return;
  const end = MODE === 'host' ? H.timerEnd : P.localEnd;
  const total = MODE === 'host' ? H.timerTotal : P.total;
  const bar = document.getElementById('tbar');
  if (!end){ num.textContent = ''; if (bar) bar.style.width = '0%'; return; }
  const left = Math.max(0, end - Date.now());
  num.textContent = Math.ceil(left / 1000);
  const secs = Math.ceil(left / 1000);
  if (secs > 5 || secs < 1) SND.tick = 0;
  else if (secs !== SND.tick && ['answer', 'vote', 'tally'].includes(SND.cur)){ SND.tick = secs; SFX.tick(secs === 1); }
  if (bar) bar.style.width = (total ? left / total * 100 : 0) + '%';
}, 200);

/* ===================== AVVIO ===================== */
(() => {
  const room = (new URLSearchParams(location.search).get('room') || '').toUpperCase();
  const x = loadSess();
  if (x && (!room || room === x.code)) resumeSess(x);
  else if (room) joinScreen();
  else home();
})();
</script>
